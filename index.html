<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Language Call</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }

        .app {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        #question {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 8px;
            min-height: 30px;
        }

        #answerInput {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }

        .row {
            padding: 10px;
            margin-top: 10px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .good {
            color: green;
        }

        .bad {
            color: red;
        }

        #scenarioList {
            margin-top: 15px;
        }

        .scenario {
            padding: 10px;
            margin-top: 5px;
            background: #eeeeee;
            border-radius: 8px;
            cursor: pointer;
        }

        .scenario:hover {
            background: #dddddd;
        }

    </style>
</head>


<body>

<div class="app">

    <h1>📞 Language Call</h1>

    <h3>Import scenario</h3>

    <input
        type="file"
        id="fileInput"
        accept=".json"
    >

    <br>

    <button id="importButton">
        Import JSON
    </button>


    <h3>Saved scenarios</h3>

    <div id="scenarioList">
        No scenarios saved.
    </div>


    <button id="startButton">
        Start Call
    </button>


    <div id="question">
        No active call.
    </div>


    <input
        type="text"
        id="answerInput"
        placeholder="Type your answer"
    >

    <button id="sendButton">
        Send Answer
    </button>


    <h3>Conversation History</h3>

    <div id="history"></div>

</div>


<script>

/* =========================================================
   APPLICATION
   ========================================================= */

const App = {

    scenario: null,

    currentNode: null,

    session: []

};


/* =========================================================
   INDEXEDDB
   ========================================================= */

const DB_NAME = "LanguageCallDB";

const DB_VERSION = 2;

const STORE_SCENARIOS = "scenarios";
const STORE_SESSIONS = "sessions";
let db;


/* =========================================================
   OPEN DATABASE
   ========================================================= */

function openDatabase() {

    return new Promise((resolve, reject) => {

        const request =
            indexedDB.open(DB_NAME, DB_VERSION);


        request.onupgradeneeded = function(event) {

            const database = event.target.result;

            if (!database.objectStoreNames.contains(STORE_SCENARIOS)) {

                database.createObjectStore(
                    STORE_SCENARIOS,
                    {
                        keyPath: "id"
                    }
                );

            }
        if (!database.objectStoreNames.contains(STORE_SESSIONS)) {

                database.createObjectStore(
                    STORE_SESSIONS,
                    {
                        keyPath: "id"
                    }
                );

            }

        };


        request.onsuccess = function(event) {

            db = event.target.result;

            resolve(db);

        };


        request.onerror = function() {

            reject(request.error);

        };

    });

}


/* =========================================================
   SAVE SCENARIO
   ========================================================= */

function saveScenario(scenario) {

    return new Promise((resolve, reject) => {

        const transaction =
            db.

transaction(
                STORE_SCENARIOS,
                "readwrite"
            );


        const store =
            transaction.objectStore(
                STORE_SCENARIOS
            );


        const data = {

            id: scenario.id || scenario.title,

            title: scenario.title,

            language: scenario.language || "en-US",

            scenario: scenario

        };


        const request =
            store.put(data);


        request.onsuccess = function() {

            resolve();

        };


        request.onerror = function() {

            reject(request.error);

        };

    });

}
 function saveSession(session) {
return new Promise((resolve, reject) => {

    const transaction =
        db.transaction(
            STORE_SESSIONS,
            "readwrite"
        );

    const store =
        transaction.objectStore(
            STORE_SESSIONS
        );

    const request =
        store.put(session);

    request.onsuccess = () =>
        resolve();

    request.onerror = () =>
        reject(request.error);

});
}



/* =========================================================
   GET ALL SCENARIOS
   ========================================================= */

function getAllScenarios() {

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(
                STORE_SCENARIOS,
                "readonly"
            );


        const store =
            transaction.objectStore(
                STORE_SCENARIOS
            );


        const request =
            store.getAll();


        request.onsuccess = function() {

            resolve(request.result);

        };


        request.onerror = function() {

            reject(request.error);

        };

    });

}
 /* =========================================================
   LOAD SCENARIOS INTO SCREEN
   ========================================================= */

async function loadScenarioList() {

    const scenarios =
        await getAllScenarios();


    const container =
        document.getElementById("scenarioList");


    container.innerHTML = "";


    if (scenarios.length === 0) {

        container.textContent =
            "No scenarios saved.";

        return;

    }
    App.scenario =
        scenarios[0].scenario;

    scenarios.forEach(item => {

        const div =
            document.createElement("div");


        div.className = "scenario";


        div.textContent =
            item.title +
            " (" +
            item.language +
            ")";


        div.onclick = function() {

            App.scenario =
                item.scenario;


            alert(
                "Scenario selected: " +
                App.scenario.title
            );

        };


        container.appendChild(div);

    });

}


/* =========================================================
   IMPORT JSON
   ========================================================= */

async function importScenario() {

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];


    if (!file) {

        alert("Choose a JSON file first.");

        return;

    }


    try {

        const text =
            await file.text();


        const scenario =
            JSON.parse(text);


        /*
         * If JSON doesn't contain an ID,
         * use title as temporary ID.
         */

        if (!scenario.id) {

            scenario.id =
                scenario.title;

        }


        await saveScenario(
            scenario
        );


        App.scenario =
            scenario;


        await loadScenarioList();


        alert(
            "Scenario saved: " +
            scenario.title
        );


    }

    catch(error) {

        console.error(error);


        alert(
            "Error reading JSON file."
        );

    }

}


/* =========================================================
   GET NODE
   ========================================================= */

function getNode(id) {

    return App.scenario.nodes.find(
        node => node.id === id
    );

}


/* =========================================================
   START CALL
   ========================================================= */

function startCall() {

    if (!App.scenario) {

        alert(
            "Select or import a scenario first."
        );

        return;

    }


    App.session = [];


    App.currentNode =
        App.scenario.startNode;


    document.getElementById(
        "history"
    ).innerHTML = "";
showCurrentNode();

}


/* =========================================================
   SHOW CURRENT QUESTION
   ========================================================= */

function showCurrentNode() {

    const node =
        getNode(
            App.currentNode
        );


    if (!node) {

        alert(
            "Node not found: " +
            App.currentNode
        );

        return;

    }


    document.getElementById(
        "question"
    ).textContent =
        node.question;


    speak(
        node.question
    );

}


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speak(text) {

    if (!window.speechSynthesis) {

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        App.scenario.language ||
        "en-US";


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SEND ANSWER
   ========================================================= */

function submitAnswer() {

    const input =
        document.getElementById(
            "answerInput"
        );


    const answer =
        input.value.trim();


    if (!answer) {

        return;

    }


    processAnswer(answer);


    input.value = "";

}


/* =========================================================
   PROCESS ANSWER
   ========================================================= */

function processAnswer(text) {

    const node =
        getNode(
            App.currentNode
        );


    let matched = false;

    let nextNode = null;


    for (
        const transition
        of node.transitions
    ) {

        for (
            const phrase
            of transition.accepted
        ) {

            if (
                text
                .toLowerCase()
                .includes(
                    phrase.toLowerCase()
                )
            ) {

                matched = true;

                nextNode =
                    transition.next;

                break;

            }

        }


        if (matched) {

            break;

        }

    }


    addHistory(
        node.question,
        text,
        matched
    );


    if (nextNode) {

        App.currentNode =
            nextNode;


        showCurrentNode();

    }

    else {

        document.getElementById(
            "question"
        ).textContent =
            "Sorry, I didn't understand.";


        speak(
            "Sorry, I didn't understand."
        );

    }

}


/* =========================================================
   HISTORY
   ========================================================= */

function addHistory(
    question,
    answer,
    success
) {

    const div =
        document.createElement("div");


    div.className =
        "row";


    div.innerHTML = `

        <b>Question:</b>
        ${question}

        <br>

        <b>Your answer:</b>
        ${answer}

        <br>

        <span class="${success ? "good" : "bad"}">

        ${
            success
            ? "Accepted"
            : "Not accepted"
        }

        </span>

    `;


    /*
     * appendChild = add to the END.
     * Therefore the dialogue appears
     * from the first question downward.
     */

    document
        .getElementById("history")
        .appendChild(div);

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById("importButton")
    .addEventListener(
        "click",
        importScenario
    );


document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startCall
    );


document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        submitAnswer
    );


/* =========================================================
   ENTER KEY

========================================================= */

document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                submitAnswer();

            }

        }
    );


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function init() {

    try {

        await openDatabase();

        await loadScenarioList();

        console.log(
            "IndexedDB initialized."
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "IndexedDB is not available."
        );

    }

}


init();

</script>

</body>
</html>
